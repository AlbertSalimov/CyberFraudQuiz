apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: cyber-fraud-quiz
data:
  default.conf: |
    upstream app {
      server web:8000;
    }

    server {
        listen 80;

        access_log /var/log/nginx/CyberFraudQuiz_access.log;
        error_log /var/log/nginx/CyberFraudQuiz_error.log;

        location /static/ {
            alias /static/;
            expires 30d;
        }

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: cyber-fraud-quiz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.26-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: static
              mountPath: /static
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: nginx-config
        - name: static
          persistentVolumeClaim:
            claimName: static-data
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: cyber-fraud-quiz
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
