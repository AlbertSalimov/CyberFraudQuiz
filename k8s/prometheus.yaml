apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cyber-fraud-quiz
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'django_app'
        static_configs:
          - targets: [ 'web:8000' ]
        metrics_path: '/metrics'
      
      - job_name: 'node_exporter'
        static_configs:
          - targets: [ '172.18.0.1:9100' ]
        metrics_path: '/metrics'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cyber-fraud-quiz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cyber-fraud-quiz
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
